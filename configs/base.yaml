experiment:
  name: experiment
  seed: 42
  output_dir: runs

teacher:
  architecture: resnet34
  kwargs: {}
  checkpoint: checkpoints/teacher.pt
student:
  architecture: resnet18
  kwargs: {}

synthetic_data:
  num_samples: 200000
  priors:
    linear_gradient: {weight: 1.0}
    perlin: {weight: 1.0}
    uniform: {weight: 1.0}
    gabor: {weight: 1.0}
    checkerboard: {weight: 1.0}
    gaussian: {weight: 1.0}

augmentation:
  enabled: true
  crop_padding: 4
  horizontal_flip: true
  num_random_ops: 3
  operations:
    rotation: {degrees: 20}
    affine: {degrees: 15, translate: [0.1, 0.1], scale: [0.9, 1.1], shear: 10}
    perspective: {distortion_scale: 0.25, p: 1.0}
    random_resized_crop: {scale: [0.6, 1.0], ratio: [0.8, 1.25]}
    color_jitter: {brightness: 0.3, contrast: 0.3}
    gaussian_blur: {kernel_size: 3, sigma: [0.1, 1.5]}
    sharpness: {sharpness_factor: 2.0, p: 1.0}
    autocontrast: {p: 1.0}
    inversion: {p: 1.0}
    gaussian_noise: {std: 0.05}
    cutout: {fraction: 0.25}

distillation:
  loss: kl_divergence
  temperature: 20.0

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005

training:
  epochs: 200
  batch_size: 256
  device: auto

evaluation:
  every: 1
  batch_size: 256

teacher_training:
  epochs: 100
  batch_size: 128
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
