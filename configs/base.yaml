experiment:
  name: experiment
  seed: 42
  output_dir: runs

teacher:
  architecture: resnet34
  kwargs: {}
  checkpoint: checkpoints/teacher.pt
student:
  architecture: resnet18
  kwargs: {}

# Fixed notebook corpus: 1500 groups of 100 images, one random family per group.
synthetic_data:
  num_samples: 150000
  group_size: 100
  materialize: true
  priors:
    linear_gradient: {weight: 1.0}
    perlin: {weight: 1.0, params: {resolutions: [2, 4, 8]}}
    uniform: {weight: 1.0}
    gabor: {weight: 1.0, params: {frequency: [2.0, 8.0], sigma: [0.3, 0.8]}}
    checkerboard: {weight: 1.0, params: {block_sizes: [2, 4, 8, 16]}}
    pink: {weight: 1.0}
    rect_patch: {weight: 1.0}
    closed_curve: {weight: 1.0}
    random_circles: {weight: 1.0}

# Stage 1: two geometric transforms, always applied, in order.
# Stage 2: num_random_ops of the 17 operations below, drawn without replacement.
augmentation:
  enabled: true
  geometric:
    crop: {padding: 4, padding_mode: reflect}
    horizontal_flip: true
  num_random_ops: 8
  without_replacement: true
  operations:
    rotation: {degrees: 20}
    affine: {degrees: 12, translate_pixels: 2, scale: [0.82, 1.18], shear: 12}
    perspective: {distortion_scale: 0.35, p: 1.0}
    random_resized_crop: {scale: [0.65, 1.0], ratio: [0.85, 1.15]}
    color_jitter: {brightness: 0.45, contrast: 0.45, saturation: 0.45, hue: 0.12}
    grayscale: {p: 1.0}
    gaussian_blur: {kernel_sizes: [3, 5], sigma: [0.1, 2.2]}
    sharpness: {sharpness_factor: [0.0, 3.5]}
    autocontrast: {p: 1.0}
    histogram_equalization: {p: 1.0}
    posterization: {bits: [3, 4, 5, 6]}
    solarization: {threshold: [0.3, 0.9]}
    inversion: {p: 1.0}
    gaussian_noise: {std: [0.01, 0.08]}
    salt_and_pepper_noise: {probability: [0.01, 0.06]}
    cutout: {scale: [0.02, 0.25], ratio: [0.3, 3.3], fill: 0.0}
    random_color_region_erasing: {min_size: 4, max_size: 12}

distillation:
  loss: kl_divergence
  temperature: 20.0

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0005

# The LR curve restarts within each batch-size phase, so every batch-size
# regime trains under a full decay rather than a near-zero tail.
scheduler:
  name: cosine
  phase_resets: true
  min_lr_ratio: 0.00001

training:
  epochs: 200
  batch_size_schedule: [16, 64, 256, 1024]
  phase_epochs: 50
  drop_last: true
  device: auto
  runtime:
    precision: auto       # CUDA bf16 if supported, otherwise scaled fp16; CPU fp32
    channels_last: true
    tf32: true
    fused_sgd: true
    cudnn_benchmark: true
    num_workers: auto     # min(16, CPU count - 1); set 0 for debugging
    prefetch_factor: null # hardware-aware default

evaluation:
  every: 1
  batch_size: 256

teacher_training:
  epochs: 100
  batch_size: 128
  optimizer:
    name: sgd
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
  scheduler:
    name: cosine
    phase_resets: false
  validation_fraction: 0.1
  label_smoothing: 0.0
  # Mild dataset-aware crop/flip; validation remains unaugmented.
  augmentation:
    enabled: true
  early_stopping:
    patience: 20         # 0 disables stopping; best checkpoint still selected
    min_epochs: 60       # patience starts counting here, allowing LR decay
    min_delta: 0.0001    # validation NLL; independent of raw best checkpoint
